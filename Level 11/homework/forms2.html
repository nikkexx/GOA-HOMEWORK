<!--
3) ყველა კომპონენტი (თეგები და ატრიბუტები), რაც სრულყოფილი ფორმის შექმნას სჭირდება

ძირითადი თეგები:
<form> - ფორმის მთავარი კონტეინერი
<input> - ინფორმაციის შესაყვანი ველები
<label> - input ველის აღწერა
<textarea> - დიდი ტექსტის შესაყვანი ველი
<select> - ჩამოსაშლელი სია
<option> - select ელემენტის არჩევანი
<button> - ღილაკი
<fieldset> - ველების დაჯგუფება
<legend> - fieldset-ის სათაური

ძირითადი ატრიბუტები:
type - input-ის ტიპი (text, password, email, radio, checkbox, submit...)
name - მონაცემის სახელი
id - ელემენტის უნიკალური იდენტიფიკატორი
value - ელემენტის მნიშვნელობა
placeholder - მინიშნება input ველში
required - სავალდებულო ველი
for - label-ს აკავშირებს input-სთან
action - მისამართი სადაც ფორმის მონაცემები იგზავნება
method - მონაცემის გაგზავნის მეთოდი (GET ან POST)
-->

<!--
4) name ატრიბუტის მნიშვნელობა forms-ში

name ატრიბუტი გამოიყენება იმისთვის, რომ სერვერმა იცოდეს
რომელი მონაცემი რომელი ველიდან არის გაგზავნილი.

მაგალითად თუ input-ს აქვს name="email",
მომხმარებლის მიერ შეყვანილი email გაიგზავნება სერვერზე
ამ სახელით და მონაცემთა ბაზაშიც ასე შეინახება.
-->

<!--
5) value ატრიბუტის მნიშვნელობა forms-ში

value ატრიბუტი განსაზღვრავს იმ მნიშვნელობას
რომელიც გაიგზავნება ფორმის გაგზავნის დროს.

მაგალითად radio ღილაკში:
თუ value="male", არჩევისას სერვერზე გაიგზავნება male.

ასევე submit ღილაკში value განსაზღვრავს
ღილაკზე დაწერილ ტექსტს.
-->

<!--
6) როგორ მუშაობს Form Submitting (Data-bases)

1) მომხმარებელი ავსებს ფორმას (სახელი, ემაილი, პაროლი და სხვა).
2) მომხმარებელი აჭერს Submit ღილაკს.
3) ბრაუზერი აგროვებს ყველა input-ის მონაცემს.
4) მონაცემები იგზავნება სერვერზე (action ატრიბუტში მითითებულ მისამართზე).
5) სერვერი იღებს ამ მონაცემებს.
6) შემდეგ სერვერი ამ მონაცემებს ინახავს მონაცემთა ბაზაში
მაგალითად: MySQL, PostgreSQL ან SQLite.

ანუ პროცესი ასეთია:
Form → Server → Database
-->
