<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სარეგისტრაციო ფორმა</title>
</head>
<body>
    <form>
        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="surname">გვარი</label><br>
        <input type="text" id="surname" name="surname" required><br><br>

        <label for="email">ემაილი:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" name="password" required><br>
        <input type="submit" value="რეგისტრაცია">

        <p>აირჩიეთ სქესი:</p>
        <input type="radio" id="male" name="gander" value="male" required>
        <label for="male">კაცი</label><br>
        <input type="radio" id="famale" name="gander" value="famale">
        <label for="famale">ქალი: </label><br><br> 
        <input type="submit" value="აირჩიე">

    </form>
</body>
</html>
